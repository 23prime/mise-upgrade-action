name: Check TypeScript

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "__tests__/**"
      - "dist/index.js"
      - "mise/tasks/**"
      - "mise.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "jest.config.js"
      - ".github/workflows/check-typescript.yml"
  pull_request:
    paths:
      - "src/**"
      - "__tests__/**"
      - "dist/index.js"
      - "mise/tasks/**"
      - "mise.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "jest.config.js"
      - ".github/workflows/check-typescript.yml"

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install mise and setup
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: mise run install

      - name: Check
        run: mise run ts-check

      - name: Check dist freshness
        run: mise run dist-check
